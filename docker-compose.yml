# Argus AI / Cherenkov — Unified Docker Infrastructure
# Provides full containerization for Redis, PostgreSQL, Streamlit Dashboard,
# and the Cherenkov Streaming Detection Pipeline.

services:
  redis:
    image: redis:7-alpine
    container_name: cherenkov-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cherenkov-postgres
    environment:
      POSTGRES_DB: cherenkov
      POSTGRES_USER: cherenkov
      POSTGRES_PASSWORD: cherenkov_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cherenkov -d cherenkov"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cherenkov-pipeline
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://cherenkov:cherenkov_dev_password@postgres:5432/cherenkov
      CHERENKOV_PG_HOST: postgres
      CHERENKOV_PG_PORT: 5432
      CHERENKOV_LOG_DIR: /app/data/raw/logs
    volumes:
      - ./data:/app/data
      - ./dataset:/app/dataset:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["python", "-m", "pipeline.consumer", "up", "--auto-start", "--no-network"]
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cherenkov-dashboard
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://cherenkov:cherenkov_dev_password@postgres:5432/cherenkov
      CHERENKOV_PG_HOST: postgres
      CHERENKOV_PG_PORT: 5432
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped

  zeek:
    image: zeek/zeek:latest
    container_name: cherenkov-zeek
    profiles: ["sensors", "full"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    volumes:
      - ./data/replay:/pcap:ro
      - ./data/sample_logs/live/zeek:/data
      - ./ingest/zeek_config/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
    command: ["zeek", "-C", "-i", "veth1", "local"]
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:latest
    container_name: cherenkov-suricata
    profiles: ["sensors", "full"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    volumes:
      - ./data/replay:/pcap:ro
      - ./data/sample_logs/live/suricata:/var/log/suricata
    command: ["suricata", "-i", "veth1", "-k", "none"]
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
